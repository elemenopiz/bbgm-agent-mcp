name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Note on real-engine tests
        run: |
          test -z "${BBGM_SOURCE_DIR:-}"
          test "${BBGM_REAL_ENGINE:-0}" != "1"
          echo "This job intentionally does not set BBGM_SOURCE_DIR or BBGM_REAL_ENGINE."
          echo "Real-engine tests are gated behind BBGM_REAL_ENGINE=1 (see CONTRIBUTING.md)"
          echo "and require a separately obtained, license-encumbered Basketball GM / zengm"
          echo "checkout that this CI job intentionally does not provide."
          echo "The describe.skipIf(!runRealEngine, ...) guard in each such test file"
          echo "makes vitest report them as SKIPPED below, not as passed or missing."

      - name: Build (required by compiled stdio E2E)
        run: pnpm build

      - name: Test (engine-independent)
        run: pnpm test

      - name: Verify build leaves tracked files unchanged
        run: test -z "$(git status --short --untracked-files=no)"
