name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Note on real-engine tests
        run: |
          echo "This job does not set BBGM_SOURCE_DIR or BBGM_REAL_ENGINE."
          echo "Real-engine tests are gated behind BBGM_REAL_ENGINE=1 (see CONTRIBUTING.md)"
          echo "and require a separately obtained, license-encumbered Basketball GM / zengm"
          echo "checkout that this CI job intentionally does not provide."
          echo "The describe.skipIf(!runRealEngine, ...) guard in each such test file"
          echo "makes vitest report them as SKIPPED below, not as passed or missing."

      - name: Test (engine-independent)
        run: pnpm test

      - name: Build
        run: pnpm build
